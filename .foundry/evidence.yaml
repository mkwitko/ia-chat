claims:
  - id: EVID-STRATEGY-001
    claim: "The current owner-defined target is small service businesses with appointment-based workflows; the first pilot is a chiropractor and expansion to other segments is deferred until evidence supports it."
    evidence_class: E3
    status: current
    source_type: repository
    source: docs/spec/11-pequenos-negocios.md
    checked_at: "2026-11-27T09:00:00-03:00"
    published_at: "2026-11-25T12:00:00-03:00"
    segment: small appointment-based service businesses
    sample_size: null
    confidence: high
    limitations:
      - "This is an owner-authored strategic choice, not proof of product-market fit."
      - "The chiropractor is the first pilot vertical; adjacent segments have not been validated."
    falsifier: "Repeated real-buyer disqualification or paid-retention evidence showing the target segment is not viable."
    review_after_days: 45
    revalidate_on: [new_paid_customer_segment, repeated_disqualification, material_channel_mismatch]
