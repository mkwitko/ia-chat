decisions:
  - id: DEC-ICP-001
    decision: "Start with small appointment-based service businesses and use the chiropractor as the first pilot vertical; defer expansion until real paid-retention evidence supports it."
    owner: founder
    status: accepted
    decided_at: "2026-11-25T12:00:00-03:00"
    evidence_ids: [EVID-STRATEGY-001, EVID-SIMULATION-001]
    alternatives:
      - "Target all small businesses immediately."
      - "Remain exclusively in health and wellness without validating adjacent appointment-based businesses."
    expected_outcome: "Keep the initial offer and onboarding focused while learning from the first pilot and permission-based referrals."
    review_on: "2027-01-20"
    review_trigger: "Review after the first real prospect cohort and initial paid retention evidence."
  - id: DEC-CHANNEL-001
    decision: "Prioritize permission-based pilot referrals, live demonstrations and founder-led Instagram; defer paid ads and purchased lead lists."
    owner: founder
    status: accepted
    decided_at: "2026-11-25T12:00:00-03:00"
    evidence_ids: [EVID-CHANNEL-001, EVID-LAUNCH-TARGET-001]
    alternatives:
      - "Start paid acquisition before validating activation and unit economics."
      - "Buy contact lists or automate cold outreach."
    expected_outcome: "Generate a small number of qualified conversations with high trust and low cash spend."
    review_on: "2027-01-20"
    review_trigger: "Review after the first ten prospect conversations and channel attribution."
  - id: DEC-OFFER-001
    decision: "Keep the documented plan prices and fourteen-day connected trial; offer only Essencial and Agenda for now, with assisted setup included and no setup fee."
    owner: founder
    status: accepted
    decided_at: "2026-11-25T12:00:00-03:00"
    evidence_ids: [EVID-PRICE-001, EVID-SIMULATION-001]
    alternatives:
      - "Discount all plans based on the simulated panel."
      - "Sell Pro and Clínica before their capabilities are available."
    expected_outcome: "Preserve the current offer while collecting real buyer behaviour and operational cost data."
    review_on: "2027-01-20"
    review_trigger: "Review after ten real sales conversations and the first paid cohort."
  - id: DEC-PRIVACY-001
    decision: "Keep patient and clinical content out of Foundry analytics and growth records; require explicit permission or a permission-based introduction before contacting referred businesses."
    owner: founder
    status: accepted
    decided_at: "2026-11-26T12:00:00-03:00"
    evidence_ids: [EVID-WAITLIST-001, EVID-REFERRAL-001]
    alternatives:
      - "Copy patient or waitlist contacts into a prospect CRM."
      - "Treat a referral code or third-party recommendation as permission to contact."
    expected_outcome: "Protect patient privacy and prevent unsolicited third-party outreach."
    review_on: "2027-02-01"
    review_trigger: "Review on any material change to data processing, marketing or referral flows."
  - id: DEC-MEASUREMENT-001
    decision: "Reuse existing first-party tables and product views before adding an analytics vendor or a second CRM."
    owner: founder
    status: proposed
    decided_at: "2026-11-27T09:00:00-03:00"
    evidence_ids: [EVID-ANALYTICS-001, EVID-REFERRAL-001]
    alternatives:
      - "Install a third-party analytics SDK before mapping existing sources."
      - "Create a second CRM for end customers and patient records."
    expected_outcome: "Reduce integration cost and keep the acquisition funnel privacy-safe."
    review_on: "2026-12-04"
    review_trigger: "Review after the source inventory identifies unmeasurable milestones."
experiments:
  - id: EXP-REFERRAL-001
    hypothesis: "Permission-based introductions and live demonstrations can produce qualified discovery conversations and WhatsApp-connected trials in the initial appointment-based segment."
    status: proposed
    owner: founder
    target_segment: "Small appointment-based service businesses, beginning with warm introductions from the chiropractor pilot."
    intervention: "Run up to ten real prospect conversations from permission-based referrals and the documented live-demo channel; record source, fit, pain evidence, buying role, demo outcome, WhatsApp connection and next step."
    primary_metric: "Count of qualified prospects who complete a demo and connect WhatsApp; report every count with its denominator."
    guardrails:
      - "The launch plan's 6 connected trials and 3 paid customers from 10 invited prospects are targets, not forecasts or achieved results."
      - "No outreach without explicit permission or a permission-based introduction."
      - "No mass messaging, purchased lists, patient data or fabricated proof."
      - "Review each account individually; do not claim statistical significance from ten prospects."
    started_at: null
    decision_date: "2027-01-10"
    result: null
    decision: null
  - id: EXP-PRICE-001
    hypothesis: "Real buyer behaviour may differ between R$ 247 and R$ 297 for the Agenda plan; simulated panel responses are insufficient to choose a price."
    status: proposed
    owner: founder
    target_segment: "The first ten qualified real prospects who complete a sales conversation."
    intervention: "Use the owner-documented R$ 247 versus R$ 297 Agenda price comparison only after the owner reconfirms the test; keep the offer and terms identical and record the price shown."
    primary_metric: "Paid conversions by price shown, with numerator and denominator."
    guardrails:
      - "Do not imply a discount or create false urgency."
      - "Do not claim statistical significance from a tiny sample."
      - "Do not change the price for existing customers without a separate owner decision."
      - "Do not start before the prospect cohort and measurement plan are approved."
    started_at: null
    decision_date: "2027-01-16"
    result: null
    decision: null
