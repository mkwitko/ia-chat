experiments:
  - id: pilot-first-value-baseline
    hypothesis: "If the assistant is configured and controlled correctly, the pilot will complete at least one useful assistant-handled interaction and ideally one assistant-created booking without the owner typing the booking."
    status: proposed
    owner: founder
    target_segment: "One chiropractor pilot"
    intervention: "Confirm pilot readiness, record aggregate milestone timestamps and counts for WhatsApp connection, setup completion, first approved assistant reply and first assistant-created booking. Use no patient text or clinical details."
    primary_metric: "First assistant-created booking completed (absolute count; denominator is the single pilot account)."
    guardrails:
      - "Do not collect or store raw patient messages, phone numbers, names, diagnoses or clinical details in Foundry."
      - "Keep approval-before-send enabled throughout the first measurement window."
      - "Record the time-to-first-useful-interaction as a secondary metric, with an explicit start and end event."
      - "No testimonial or public claim without specific written permission."
      - "Do not infer statistical significance from one pilot."
    started_at: null
    decision_date: "2026-12-04"
    result: null
    decision: null
