packages:
  - apps/*
  - packages/*

# Supply chain (see docs/plan/IMPLEMENTACAO.md, E-01).
# Only install versions published at least 7 days ago; fail if none qualifies.
# Urgent security fix younger than that (pnpm audit failing in CI): list only that
# exact version under minimumReleaseAgeExclude, e.g. `- some-pkg@1.2.4`, and remove it later.
minimumReleaseAge: 10080
# Fail if a package's publishing trust level drops (e.g. lost provenance).
trustPolicy: no-downgrade
# Transitive deps may not come from git or tarball URLs.
blockExoticSubdeps: true
# Install scripts are blocked; any dependency that needs one must be listed here after review.
strictDepBuilds: true
allowBuilds:
  # Node version check only.
  prisma: false
  # Downloads the schema engine binary (needed by prisma migrate) from Prisma's CDN.
  '@prisma/engines': true
# Exact versions in package.json.
savePrefix: ''
# Patched transitive deps of the Prisma 7.9.1 CLI (pnpm audit). Remove when Prisma ships them.
overrides:
  mysql2: 3.24.6
  effect: 3.22.1
  deepmerge-ts: 8.0.2
